name: Собрать APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Настроить исходники Clean Your TV
        run: python3 scripts/prepare-cleanyourtv-integration.py

      - name: Определить версию TV APK Installer
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Установить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Установить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-disabled: false

      - name: Проверить логику автоматизации
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Подготовить ключ подписи
        env:
          KEY_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEY_BASE64:-}" ]; then
            echo "$KEY_BASE64" | base64 --decode > signing.jks
          else
            rm -f signing.jks
            echo "Keystore secret is not configured; Gradle will use the debug signing key."
          fi

      - name: Собрать TV APK Installer
        env:
          SIGNING_STORE_FILE: ${{ github.workspace }}/signing.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY_ALIAS: tvapk
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          GRADLE_OPTS: "-Dorg.gradle.internal.http.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=120000"
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Вычислить SHA-256 APK
        id: apk
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SHA256=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Сохранить APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-APK-Installer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Опубликовать релиз для автообновления
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: TV APK Installer v${{ steps.version.outputs.name }}
          target_commitish: main
          body: |
            Автоматическая сборка TV APK Installer v${{ steps.version.outputs.name }}.
            Установочный APK прикреплён к этому релизу.

            SHA-256: ${{ steps.apk.outputs.sha256 }}
          files: app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          make_latest: true

      - name: Проверить опубликованный APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          LOCAL_APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$LOCAL_APK"

          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            -o release.json

          jq -e --arg tag "$RELEASE_TAG" \
            '.tag_name == $tag and any(.assets[]; .name == "app-debug.apk" and .size > 0)' \
            release.json >/dev/null

          APK_URL=$(jq -r '.assets[] | select(.name == "app-debug.apk") | .browser_download_url' release.json)
          curl --fail --location --silent --show-error "$APK_URL" -o published.apk

          LOCAL_SHA=$(sha256sum "$LOCAL_APK" | cut -d' ' -f1)
          PUBLISHED_SHA=$(sha256sum published.apk | cut -d' ' -f1)
          test "$LOCAL_SHA" = "$PUBLISHED_SHA"
          echo "Release $RELEASE_TAG contains the exact TV APK Installer APK."
          echo "SHA-256: $LOCAL_SHA"
