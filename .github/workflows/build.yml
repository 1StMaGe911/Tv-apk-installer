name: Собрать APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Определить версию приложения
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Установить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-disabled: false

      - name: Установить Android SDK Platform 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" --channel=3
          # AGP 9.3.1 resolves API 37.0 through compileSdk.minorApiLevel.
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Проверить отсутствие GPL SPAKE2 в runtime-зависимостях
        run: |
          gradle :app:dependencies --configuration debugRuntimeClasspath --no-daemon > "$RUNNER_TEMP/dependencies.txt"
          if grep -F "com.github.Flyfish233:spake2-java" "$RUNNER_TEMP/dependencies.txt"; then
            echo "GPL SPAKE2 dependency is still present in the Android runtime graph."
            exit 1
          fi

      - name: Проверить совместимость SPAKE2 на BoringSSL
        run: |
          CC=clang CXX=clang++ cmake -S app/src/main/cpp -B "$RUNNER_TEMP/spake2-host" -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/spake2-host" --target adb_spake2 spake2_host_test --parallel 4
          "$RUNNER_TEMP/spake2-host/spake2_host_test"
          mkdir -p "$RUNNER_TEMP/spake2-classes"
          javac -d "$RUNNER_TEMP/spake2-classes" \
            app/src/main/java/com/flyfish233/crypto/spake2/Spake2Role.java \
            app/src/main/java/com/flyfish233/crypto/spake2/Spake2Context.java \
            app/src/test/native/Spake2JniHostTest.java
          java -Djava.library.path="$RUNNER_TEMP/spake2-host" \
            -cp "$RUNNER_TEMP/spake2-classes" \
            com.flyfish233.crypto.spake2.Spake2JniHostTest

      - name: Проверить логику автоматизации
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Подготовить ключ подписи
        env:
          KEY_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$KEY_BASE64" | base64 --decode > signing.jks

      - name: Загрузить и проверить модули Clean Your TV
        run: |
          set -euo pipefail
          DIR="app/src/main/assets/cleanyourtv-modules"
          mkdir -p "$DIR"
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/udhaykumarbala/cleanyourtv-app/v0.4.8/android/platform/src/main/assets/bundled/cleanyourtv-launcher.apk" \
            -o "$DIR/cleanyourtv-launcher.apk"
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/udhaykumarbala/cleanyourtv-app/v0.4.8/android/platform/src/main/assets/bundled/cleanyourtv-curtain.apk" \
            -o "$DIR/cleanyourtv-curtain.apk"
          echo "9fcc21c0eb81548c2432b3bf89c1d9c6b6ad17dcf7f7fc2e8d90d7ccbea7d60e  $DIR/cleanyourtv-launcher.apk" | sha256sum --check
          echo "eb21e112c97121a3ed7f4db1c7fbf2169bc172a14bb3f8ca781079de4651662e  $DIR/cleanyourtv-curtain.apk" | sha256sum --check
          test "$(stat -c%s "$DIR/cleanyourtv-launcher.apk")" = "540541"
          test "$(stat -c%s "$DIR/cleanyourtv-curtain.apk")" = "65955"

      - name: Собрать APK с повторными попытками
        env:
          SIGNING_STORE_FILE: ${{ github.workspace }}/signing.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY_ALIAS: tvapk
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          GRADLE_OPTS: "-Dorg.gradle.internal.http.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=120000"
        run: |
          for attempt in 1 2 3 4; do
            echo "Попытка сборки $attempt из 4"
            if gradle :app:assembleDebug --no-daemon; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "Ошибка сборки. Повтор через 20 секунд..."
              sleep 20
            fi
          done
          echo "Все попытки сборки завершились ошибкой"
          exit 1

      - name: Проверить production package ID релизного APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          aapt dump badging "$APK" | grep -F "package: name='ru.tvapk.installer'"
          if aapt dump badging "$APK" | grep -F "package: name='ru.tvapk.installer.preview'"; then
            echo "Preview package ID must never be published as a production release."
            exit 1
          fi

      - name: Вычислить SHA-256 APK
        id: apk
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SHA256=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Подготовить описание изменений релиза
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.name }}
          APK_SHA256: ${{ steps.apk.outputs.sha256 }}
        run: |
          set -euo pipefail
          awk -v version="$RELEASE_VERSION" '
            $0 ~ "^## " version "([[:space:]]|$)" { found=1; print; next }
            found && /^## / { exit }
            found { print }
          ' README.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Не найден раздел изменений для версии $RELEASE_VERSION в README.md"
            exit 1
          fi
          {
            cat release-notes.md
            echo
            echo "Установочный APK прикреплён к этому релизу."
            echo
            echo "SHA-256: $APK_SHA256"
          } > release-body.md

      - name: Сохранить APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-APK-Installer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Опубликовать релиз для автообновления
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: TV APK Installer v${{ steps.version.outputs.name }}
          target_commitish: main
          body_path: release-body.md
          files: app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          make_latest: true

      - name: Проверить опубликованный APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          LOCAL_APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$LOCAL_APK"

          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            -o release.json

          jq -e --arg tag "$RELEASE_TAG" \
            '.tag_name == $tag and any(.assets[]; .name == "app-debug.apk" and .size > 0)' \
            release.json >/dev/null

          APK_URL=$(jq -r '.assets[] | select(.name == "app-debug.apk") | .browser_download_url' release.json)
          curl --fail --location --silent --show-error "$APK_URL" -o published.apk

          LOCAL_SHA=$(sha256sum "$LOCAL_APK" | cut -d' ' -f1)
          PUBLISHED_SHA=$(sha256sum published.apk | cut -d' ' -f1)
          test "$LOCAL_SHA" = "$PUBLISHED_SHA"
          echo "Release $RELEASE_TAG contains the exact APK produced by this workflow."
          echo "SHA-256: $LOCAL_SHA"
