name: Собрать APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "integration/apk-install-only"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Настроить исходники Clean Your TV
        run: python3 scripts/prepare-cleanyourtv-integration.py

      - name: Добавить установку APK в Clean Your TV
        run: python3 scripts/enable-apk-install.py

      - name: Добавить управление приложениями телевизора
        run: python3 scripts/enable-tv-app-management.py

      - name: Добавить историю установок APK
        run: python3 scripts/enable-install-history.py

      - name: Добавить диагностику Android TV
        run: python3 scripts/enable-tv-diagnostics.py
        
      - name: Добавить состояние сети и общую оценку ТВ
        run: python3 scripts/extend-tv-diagnostics.py

      - name: Добавить журнал изменений телевизора
        run: python3 scripts/enable-change-history.py

      - name: Добавить активацию лицензии
        run: python3 scripts/enable-license-gate.py
 
      - name: Включить автоматическую проверку обновлений
        run: python3 scripts/enable-automatic-updates.py

      - name: Добавить проверку автозапуска телевизора
        run: python3 scripts/enable-startup-receiver-inventory.py

      - name: Добавить управление компонентами автозапуска
        run: python3 scripts/enable-startup-receiver-controls.py

      - name: Исправить возврат с экрана восстановления ТВ
        run: python3 scripts/fix-tv-resume-back.py

      - name: Исправить выход из незавершённой настройки и выбор ТВ
        run: python3 scripts/fix-setup-abandon-navigation.py

      - name: Добавить Unicode-клавиатуру для удалённого ТВ
        run: python3 scripts/enable-remote-ime.py

      - name: Добавить плавающий пульт управления ТВ
        run: python3 scripts/enable-floating-remote.py

      - name: Добавить сопряжение Android TV по коду
        run: python3 scripts/enable-wireless-pairing.py

      - name: Исправить переход из уведомления об обновлении
        run: python3 scripts/fix-update-notification-routing.py

      - name: Определить версию Clean Your TV
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Установить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Установить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-disabled: false

      - name: Установить Android NDK и CMake для SPAKE2
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Проверить versionCode относительно опубликованного APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT_CODE=$(awk -F' = ' '/versionCode =/ {gsub(/[^0-9]/, "", $2); print $2; exit}' app/build.gradle.kts)
          CURRENT_NAME=$(grep 'versionName =' app/build.gradle.kts | head -n 1 | cut -d '"' -f2)
          if [ -z "$CURRENT_CODE" ] || [ -z "$CURRENT_NAME" ]; then
            echo "::error::Could not read versionCode/versionName from app/build.gradle.kts."
            exit 1
          fi
          API="https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest"
          if ! curl --fail --silent --show-error -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" "$API" -o latest-release.json; then
            echo "No published release found; versionCode baseline check skipped."
            exit 0
          fi
          LATEST_TAG=$(jq -r '.tag_name' latest-release.json)
          APK_URL=$(jq -r '.assets[] | select(.name == "app-full-debug.apk") | .browser_download_url' latest-release.json)
          if [ -z "$APK_URL" ] || [ "$APK_URL" = "null" ]; then
            echo "::error::Latest release has no app-full-debug.apk; refusing an unverified update."
            exit 1
          fi
          curl --fail --location --silent --show-error "$APK_URL" -o previous-release.apk
          APK_ANALYZER=$(find "$ANDROID_HOME" -type f -name apkanalyzer | head -n 1)
          if [ -z "$APK_ANALYZER" ]; then
            echo "::error::apkanalyzer was not found."
            exit 1
          fi
          PREVIOUS_CODE=$("$APK_ANALYZER" manifest version-code previous-release.apk)
          echo "Latest published: $LATEST_TAG (versionCode $PREVIOUS_CODE)"
          echo "Candidate: v$CURRENT_NAME (versionCode $CURRENT_CODE)"
          if [ "$LATEST_TAG" = "v$CURRENT_NAME" ]; then
            if [ "$CURRENT_CODE" -ne "$PREVIOUS_CODE" ]; then
              echo "::error::Rebuilding the same release must keep its versionCode unchanged."
              exit 1
            fi
          elif [ "$CURRENT_CODE" -le "$PREVIOUS_CODE" ]; then
            echo "::error::versionCode must be greater than the latest published APK."
            exit 1
          fi

      - name: Проверить логику автоматизации
        env:
          JAVA_TOOL_OPTIONS: "--add-exports=java.base/jdk.internal.access=ALL-UNNAMED"
        run: gradle :app:testFullDebugUnitTest --no-daemon

      - name: Проверить и подготовить постоянный ключ подписи
        env:
          KEY_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEY_BASE64:-}" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 is missing. Refusing to build an APK with a temporary debug key."
            exit 1
          fi
          if [ -z "${STORE_PASSWORD:-}" ]; then
            echo "::error::SIGNING_PASSWORD is missing."
            exit 1
          fi
          printf '%s' "$KEY_BASE64" | base64 --decode > signing.jks
          test -s signing.jks
          keytool -list -keystore signing.jks -storepass "$STORE_PASSWORD" -alias tvapk >/dev/null
          echo "Permanent signing keystore and tvapk alias verified."

      - name: Собрать Clean Your TV
        env:
          CYT_RELEASE_KEYSTORE: ${{ github.workspace }}/signing.jks
          CYT_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          CYT_RELEASE_KEY_ALIAS: tvapk
          CYT_RELEASE_KEY_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          GRADLE_OPTS: "-Dorg.gradle.internal.http.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=120000"
        run: |
          gradle :app:assembleFullDebug --no-daemon

      - name: Проверить подпись APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/full/debug/app-full-debug.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee signing-report.txt
          if grep -qi "CN=Android Debug" signing-report.txt; then
            echo "::error::APK is signed with the Android debug certificate."
            exit 1
          fi
          if [ -s previous-release.apk ]; then
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
            test -x "$APKSIGNER"
            PREVIOUS_CERT=$("$APKSIGNER" verify --print-certs previous-release.apk | awk -F': ' '/certificate SHA-256 digest/ {print $2; exit}')
            CURRENT_CERT=$(awk -F': ' '/certificate SHA-256 digest/ {print $2; exit}' signing-report.txt)
            if [ -z "$PREVIOUS_CERT" ] || [ "$PREVIOUS_CERT" != "$CURRENT_CERT" ]; then
              echo "::error::Signing certificate does not match the latest published APK."
              exit 1
            fi
            echo "Signing certificate matches the latest published APK."
          fi

      - name: Вычислить SHA-256 APK
        id: apk
        run: |
          APK="app/build/outputs/apk/full/debug/app-full-debug.apk"
          test -s "$APK"
          SHA256=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Сохранить APK
        uses: actions/upload-artifact@v4
        with:
          name: Clean-Your-TV-apk-install
          path: app/build/outputs/apk/full/debug/app-full-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Опубликовать релиз для автообновления
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Clean Your TV v${{ steps.version.outputs.name }}
          target_commitish: ${{ github.ref_name }}
          body: |
            Автоматическая сборка Clean Your TV v${{ steps.version.outputs.name }}.
            Установочный APK прикреплён к этому релизу.

            SHA-256: ${{ steps.apk.outputs.sha256 }}
          files: app/build/outputs/apk/full/debug/app-full-debug.apk
          overwrite_files: true
          make_latest: true

      - name: Проверить опубликованный APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          LOCAL_APK="app/build/outputs/apk/full/debug/app-full-debug.apk"
          test -s "$LOCAL_APK"

          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            -o release.json

          jq -e --arg tag "$RELEASE_TAG" \
            '.tag_name == $tag and any(.assets[]; .name == "app-full-debug.apk" and .size > 0)' \
            release.json >/dev/null

          APK_URL=$(jq -r '.assets[] | select(.name == "app-full-debug.apk") | .browser_download_url' release.json)

          LOCAL_SHA=$(sha256sum "$LOCAL_APK" | cut -d' ' -f1)
          PUBLISHED_SHA=""
          for attempt in 1 2 3 4 5; do
            # GitHub's release API can update before the asset CDN finishes propagating an overwritten file.
            if curl --fail --location --silent --show-error \
              "${APK_URL}?verify=${GITHUB_RUN_ID}-${attempt}" -o published.apk; then
              PUBLISHED_SHA=$(sha256sum published.apk | cut -d' ' -f1)
              if [ "$LOCAL_SHA" = "$PUBLISHED_SHA" ]; then
                break
              fi
            fi
            echo "Published APK is not yet synchronized (attempt $attempt/5); retrying..."
            sleep 5
          done
          if [ "$LOCAL_SHA" != "$PUBLISHED_SHA" ]; then
            echo "::error::Published APK SHA-256 does not match the build after 5 attempts."
            echo "Build: $LOCAL_SHA"
            echo "Published: $PUBLISHED_SHA"
            exit 1
          fi
          echo "Release $RELEASE_TAG contains the exact TV APK Installer APK."
          echo "SHA-256: $LOCAL_SHA"

# CI trigger: validate Kotlin source registration, APK installation, TV app management and update notification routing.
