name: Проверка Pull Request

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Установить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Установить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-disabled: false
      - name: Настроить исходники Clean Your TV
        run: python3 scripts/prepare-cleanyourtv-integration.py
      - name: Выполнить модульные тесты и компиляцию приложения
        run: gradle check :app:assembleFullDebug --no-daemon
      - name: Сохранить собранный APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-APK-Installer-0.9.137-debug
          path: vendor/cleanyourtv-app/app/build/outputs/apk/full/debug/app-full-debug.apk
          if-no-files-found: error
          retention-days: 14
