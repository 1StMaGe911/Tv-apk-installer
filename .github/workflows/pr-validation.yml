name: Проверка Pull Request

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Модульные тесты
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Установить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Установить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-disabled: false
      - name: Настроить исходники Clean Your TV
        run: python3 scripts/prepare-cleanyourtv-integration.py
      - name: Добавить установку APK в Clean Your TV
        run: python3 scripts/enable-apk-install.py
      - name: Добавить управление приложениями телевизора
        run: python3 scripts/enable-tv-app-management.py
      - name: Добавить Unicode-клавиатуру и плавающий пульт
        run: |
          python3 scripts/enable-remote-ime.py
          python3 scripts/enable-floating-remote.py
          python3 scripts/enable-wireless-pairing.py
      - name: Выполнить модульные тесты
        run: gradle :app:testFullDebugUnitTest --no-daemon

  build:
    name: Сборка именно TV APK Installer
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Установить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Установить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-disabled: false
      - name: Установить Android NDK и CMake для SPAKE2
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Настроить исходники Clean Your TV
        run: python3 scripts/prepare-cleanyourtv-integration.py
      - name: Добавить установку APK в Clean Your TV
        run: python3 scripts/enable-apk-install.py
      - name: Добавить управление приложениями телевизора
        run: python3 scripts/enable-tv-app-management.py
      - name: Добавить Unicode-клавиатуру и плавающий пульт
        run: |
          python3 scripts/enable-remote-ime.py
          python3 scripts/enable-floating-remote.py
          python3 scripts/enable-wireless-pairing.py
      - name: Подготовить ключ подписи
        env:
          KEY_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEY_BASE64:-}" ]; then
            echo "$KEY_BASE64" | base64 --decode > signing.jks
          else
            rm -f signing.jks
            echo "Keystore secret is not configured; Gradle will use the debug signing key."
          fi
      - name: Собрать TV APK Installer
        env:
          SIGNING_STORE_FILE: ${{ github.workspace }}/signing.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY_ALIAS: tvapk
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: gradle :app:assembleFullDebug --no-daemon
      - name: Проверить APK и канал удалённого ввода
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/full/debug/app-full-debug.apk
          test -s "$APK"
          APKANALYZER=$(find "$ANDROID_HOME" -type f -name apkanalyzer | head -n 1)
          "$APKANALYZER" manifest print "$APK" > "$RUNNER_TEMP/merged-manifest.xml"
          grep -F 'tv.cleanyour.app.remote.RemoteInputMethodService' "$RUNNER_TEMP/merged-manifest.xml"
          grep -F 'tv.cleanyour.app.remote.RemoteInputProvider' "$RUNNER_TEMP/merged-manifest.xml"
          grep -F 'ru.tvapk.installer.remoteinput' "$RUNNER_TEMP/merged-manifest.xml"
      - name: Сохранить APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-APK-Installer-0.9.84-full-debug
          path: app/build/outputs/apk/full/debug/app-full-debug.apk
          if-no-files-found: error
          retention-days: 14
