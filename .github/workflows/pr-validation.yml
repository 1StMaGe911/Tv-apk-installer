name: Проверка Pull Request

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
      - name: Установить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Установить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: false
      - name: Установить Android SDK Platform 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" --channel=3
          # sdkmanager names the preview directory android-37.0; AGP compileSdk=37 resolves android-37.
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          test -f "$ANDROID_HOME/platforms/android-37/android.jar"
      - name: Выполнить модульные тесты и компиляцию приложения
        run: gradle :app:testDebugUnitTest --no-daemon
