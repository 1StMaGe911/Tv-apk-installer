
name: Auto Unzip Archive

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get install -y unzip

      - name: Extract ZIP archives
        run: |
          for zip in *.zip; do
            [ -f "$zip" ] || continue
            unzip -o "$zip" -d .
          done

      - name: Commit extracted files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automatically extract ZIP archive"
          
